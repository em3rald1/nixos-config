shell_integration no-rc 

font_size 12.0
window_padding_width 2
background_opacity 1.0 
confirm_os_window_close 0 
cursor_shape beam 
enable_audio_bell no 
dynamic_background_opacity yes
# font_family family="UbuntuMono Nerd Font"

input_delay 2
sync_to_monitor no
repaint_delay 5

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include themes/black-metal-gorgoroth.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="UbuntuMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

map alt+o set_background_opacity 0.9
map alt+p set_background_opacity 1.0
